<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Sem conexão · Tinder Missão</title>
  <style>
    /* DESIGN_TOKENS */
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: var(--s-6); background: var(--c-bg); color: var(--c-text); font-family: var(--font); }
    main { width: 100%; max-width: 28rem; }
    img { display: block; width: 64px; height: 64px; margin-bottom: var(--s-7); }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 var(--s-4); }
    p { line-height: 1.6; color: var(--c-text-muted); margin: 0 0 var(--s-6); }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: var(--s-3) var(--s-6); border-radius: var(--r-pill); background: var(--c-brand); color: var(--c-on-brand); font-weight: 700; text-decoration: none; }
    a:hover { background: var(--c-brand-light); }
    a:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 4px; }
    ::selection { background: var(--c-brand); color: var(--c-on-brand); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Tinder Missão" width="64" height="64" />
    <h1>Vamos nos reconectar?</h1>
    <p>Você está sem conexão. Volte à internet para acessar perfis, respostas e conversas.</p>
    <a href="/">Tentar novamente</a>
  </main>
</body>
</html>
